<div id="fblc-quiz">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;700&display=swap">
<style>
#fblc-quiz{--navy:#1f2a5c;--red:#d6334a;--ink:#1a1a2e;--line:#d9dbe6;--bg:#f6f7fb;--panel:#ffffff;--link:#1f2a5c;max-width:900px;margin:0 auto;padding:0;overflow:hidden;border-radius:22px;background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 36px rgba(20,30,70,.12);font-family:Arial,Helvetica,sans-serif;color:var(--ink);box-sizing:border-box}
#fblc-quiz .hdr{font-family:'Work Sans',Arial,Helvetica,sans-serif;display:flex;align-items:center;gap:12px;background:#1f2a5c;padding:14px 24px;border-bottom:3px solid var(--red)}
#fblc-quiz .hdr-logo{height:56px;width:auto;display:block}
#fblc-quiz .hdr .year{color:#fff}
#fblc-quiz .welcome{border-radius:0;box-shadow:none}
@media(max-width:480px){#fblc-quiz .hdr{padding:12px 16px}#fblc-quiz .hdr-logo{height:44px}}
#fblc-quiz .pane{padding:34px 40px}
@media(min-width:760px){#fblc-quiz .pane{min-height:460px}}
@media(max-width:480px){#fblc-quiz .pane{padding:22px 18px}}
#fblc-quiz *{box-sizing:border-box}
#fblc-quiz .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
#fblc-quiz .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--red));}
#fblc-quiz .count{font-size:13px;color:#666;margin-bottom:20px}
#fblc-quiz h2{font-size:22px;line-height:1.35;margin:0 0 20px;color:var(--navy)}
#fblc-quiz .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 10px;font:inherit;font-size:16px;line-height:1.4;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
#fblc-quiz .opt:hover,#fblc-quiz .opt:focus-visible{border-color:var(--navy);background:var(--bg);outline:none}
#fblc-quiz .opt.sel{border-color:#1f2a5c;background:#1f2a5c;color:#fff}
#fblc-quiz .nav{margin-top:14px}
#fblc-quiz .btn{font:inherit;font-size:15px;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;background:var(--navy);color:#fff}
#fblc-quiz .btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
#fblc-quiz .btn:disabled{opacity:.35;cursor:default}
#fblc-quiz .res h2{font-size:28px;text-align:center;margin-bottom:24px}
#fblc-quiz .card{display:flex;align-items:center;gap:16px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px}
#fblc-quiz .card b{flex:none;width:40px;height:40px;border-radius:50%;background:#6b7280;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
#fblc-quiz .card{flex-wrap:wrap}
#fblc-quiz .card em{margin-left:auto;font-style:normal;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;white-space:nowrap}
#fblc-quiz .t-o{background:#d6334a;color:#fff}
#fblc-quiz .t-c{background:#8fd3f4;color:#10304a}
#fblc-quiz .t-p{background:#12337a;color:#fff}
#fblc-quiz .card span{font-size:19px;font-weight:700;color:var(--navy)}
#fblc-quiz .res .nav{text-align:center;margin-top:22px}

#fblc-quiz .welcome-top{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding-bottom:28px;border-bottom:1px solid rgba(255,255,255,.18)}
#fblc-quiz .brand-mark{display:flex;gap:3px;align-items:center;height:22px}
#fblc-quiz .brand-mark i{display:block;width:6px;border-radius:4px;background:#fff;height:15px}
#fblc-quiz .brand-mark i:nth-child(2){height:22px;background:var(--red)}
#fblc-quiz .brand-mark i:nth-child(3){height:11px}
#fblc-quiz .brand-name{font-size:12px;letter-spacing:2px;font-weight:800}
#fblc-quiz .year{margin-left:auto;font-size:20px;letter-spacing:1.5px;font-weight:700}
#fblc-quiz .welcome-content{position:relative;z-index:1;padding:38px 0;max-width:560px;width:100%;text-align:center}
#fblc-quiz .eyebrow{display:flex;align-items:center;gap:9px;font-size:10px;font-weight:700;letter-spacing:1.5px;color:#ffb9c3;margin-bottom:17px}
#fblc-quiz .eyebrow span{display:inline-block;width:22px;height:3px;background:var(--red);border-radius:4px}
#fblc-quiz .welcome h1{font-size:clamp(30px,5vw,42px);line-height:1.15;letter-spacing:-.6px;word-spacing:-4px;color:#fff;margin:0 0 18px;font-weight:700}
#fblc-quiz .welcome h1 strong{color:#ff7b8d}
#fblc-quiz .welcome-copy{letter-spacing:-.2px;word-spacing:-1px;font-size:19px;line-height:1.45;font-weight:400;color:#fff;margin:0 0 12px}
#fblc-quiz .welcome-note{font-size:14px;line-height:1.7;color:rgba(255,255,255,.76);max-width:430px;margin:0 auto 25px}
#fblc-quiz .start-btn{display:inline-flex;align-items:center;gap:22px;background:var(--red);padding:14px 19px;border-radius:9px;font-size:15px;font-weight:700;box-shadow:0 7px 18px rgba(214,51,74,.24);transition:transform .15s,background .15s}
#fblc-quiz .start-btn:hover{background:#ed4058;transform:translateY(-1px)}
#fblc-quiz .start-btn span{font-size:21px;line-height:14px}
#fblc-quiz .welcome-foot{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.75);margin-top:23px}
#fblc-quiz .spark{color:#ff7b8d;font-size:17px}
#fblc-quiz .welcome-bottom{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid rgba(255,255,255,.18);padding-top:16px;font-size:9px;letter-spacing:1.4px;color:rgba(255,255,255,.56);font-weight:700}
#fblc-quiz .bottom-dots{display:flex;gap:5px}
#fblc-quiz .bottom-dots i{width:5px;height:5px;border-radius:50%;background:#fff;opacity:.45}
#fblc-quiz .bottom-dots i:nth-child(2){background:var(--red);opacity:1}
@media(max-width:600px){#fblc-quiz .welcome{--wov:linear-gradient(rgba(23,33,79,.9),rgba(17,25,54,.88));--wpos:75% center}}
@media(max-width:480px){#fblc-quiz .welcome{padding:20px 19px 17px;min-height:430px}#fblc-quiz .welcome-content{padding:34px 0 26px}#fblc-quiz .welcome h1{font-size:32px}#fblc-quiz .welcome-copy{font-size:17px}#fblc-quiz .welcome-bottom{font-size:8px;letter-spacing:.8px}}

F":2,"FSA":1}},{"t":"Organizing the team, assigning responsibilities, and making sure everyone stays on track.","p":{"BM":3,"BP":2,"OL":1}},{"t":"Stepping back to consider the bigger picture and deciding how the event can succeed in the long run.","p":{"EC":3,"IB":2,"IBC":1}}]},{"q":"If you had to live out your life as a character in a genre, which one would it be?","a":[{"t":"Mystery: The student who discovers their teacher is using AI to grade their student’s homework.","p":{"EN":3,"BP":2,"SEM":1}},{"t":"Drama: The best friend who helps their friends feel better when they’re upset","p":{"HA":3,"HEM":2,"PS":1}},{"t":"Fantasy: The student who discovers a legendary secret society at school and must unite rival bullies to unlock its hidden power before graduation.","p":{"IB":3,"PS":2,"MK":1}},{"t":"Action: The academic warrior balancing rigorous classes with athletics and clubs","p":{"SEM":3,"OL":2,"DS":1}}]},{"q":"You’re shopping online and notice that the item you have been wanting for months has raised 40% in price. What would you be doing?","a":[{"t":"Compare prices across different stores to see if buying the item is still feasible or worth it","p":{"PF":3,"EC":2,"AC":1}},{"t":"Understanding what causes the price to increase and if the price will continue to increase","p":{"EC":3,"IB":2,"IBC":1}},{"t":"Looking into if anything is misleading or reading terms and conditions in case you decide you don’t want it after buying","p":{"BL":3,"PF":2,"MK":1}},{"t":"Looking at previous pricings, product comparison and using data to predict if price will change or there will be a discount","p":{"DS":3,"SI":2,"FSA":1}}]},{"q":"Mr. Beast is in the store that you are in, and says everything you grab is free for the next 60 seconds. What is your strategy?","a":[{"t":"Grab the most expensive items you can resell later","p":{"SI":3,"PF":2,"EN":1}},{"t":"Head straight for the things you actually need and would otherwise have paid for","p":{"PF":3,"FSA":2,"EC":1}},{"t":"Calculate which products offer the highest value per dollar before making your move","p":{"DS":3,"CP":2,"PF":1}},{"t":"Grab whatever catches your eye. It's free, and you refuse to leave empty-handed","p":{"MK":3,"IBC":2,"PF":1}}]},{"q":"You’re building a 5000 piece jigsaw puzzle. What’s your first instinct?","a":[{"t":"Open a WikiHow article on solving jigsaw puzzles","p":{"IBC":3,"CP":2,"DS":1}},{"t":"Get to work sorting each piece by shape and colour","p":{"BM":3,"BP":2,"AC":1}},{"t":"Start working on random sections of the puzzle and hope it all connects in the end","p":{"EN":3,"SEM":2,"EC":1}},{"t":"Call a friend over to help you","p":{"PS":3,"IB":2,"HEM":1}}]},{"q":"Which of the following skills are you best at?","a":[{"t":"Memorizing facts","p":{"BL":3,"HA":2,"SI":1}},{"t":"Doing quick calculations","p":{"AC":3,"PF":2,"FSA":1}},{"t":"Preparing and delivering a presentation","p":{"PS":3,"BP":2,"HEM":1}},{"t":"Coming up with creative ideas and leading people to carry them out","p":{"EN":3,"BM":2,"MK":1}}]},{"q":"Picture yourself in a career you’d love. Which kind of work sounds the most like you?","a":[{"t":"Working with numbers and money","p":{"SI":3,"AC":2,"BM":1}},{"t":"Working with technology","p":{"CP":3,"DS":2,"IBC":1}},{"t":"Working in a creative field","p":{"MK":3,"SEM":2,"PS":1}},{"t":"Working in science or health","p":{"HA":3,"DS":2,"CP":1}}]},{"q":"Which of the following best describes your personality?","a":[{"t":"I think best on my feet and come up with solutions quickly","p":{"HEM":3,"EN":2,"MK":1}},{"t":"I take my time and work through problems carefully, step by step","p":{"FSA":3,"AC":2,"BP":1}},{"t":"I’d rather study and master the material than present in front of a crowd","p":{"IBC":3,"SI":2,"BL":1}},{"t":"I’m a people person who loves helping others and making them feel welcome","p":{"HEM":3,"HA":2,"IB":1}}]},{"q":"Which of these strengths do people notice most in you?","a":[{"t":"I take on a lot, and I’m good at looking after other people’s needs","p": var avail={};Q.forEach(function(q){q.a.forEach(function(o){for(var k in o.p)avail[k]=(avail[k]||0)+o.p[k]})});
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
 if(cur===-1){
  root.innerHTML='<section class="welcome"><div class="welcome-content"><h1>Unsure what event to compete in at <strong>CNLC 2027?</strong></h1><p class="welcome-copy">Take this short quiz to find your perfect match!</p><p class="welcome-note">Answer a few fun questions about your interests and how you think. We’ll suggest the best competitive events for you to compete in!</p><button class="btn start-btn" id="fq-start">Find My Event <span aria-hidden="true">→</span></button></div></section>';
  document.getElementById('fq-start').onclick=function(){cur=0;render()};
  return;
 }
 if(cur>=N)return results();
 var q=cur===0?{q:"What grade are you in?",a:GRADES.map(function(g){return{t:"Grade "+g}})}:Q[cur-1];
 var h='<div class="pane"><div class="bar"><i style="width:'+(cur/N*100)+'%"></i></div><div class="count">Question '+(cur+1)+' of '+N+'</div><h2>'+esc(q.q)+'</h2>';

 root.innerHTML=h+'</div>';
 Array.prototype.forEach.call(root.querySelectorAll('.opt'),function(b){b.onclick=function(){if(busy)return;busy=true;ans[cur]=+b.getAttribute('data-i');setTimeout(function(){busy=false;cur++;render()},60)}});
 document.getElementById('fq-back').onclick=function(){if(!busy&&cur>-1){cur--;render()}};
}
function results(){
 for(var j=0;j<N;j++){if(ans[j]===undefined){cur=j;render();return}}
 var s={};for(var k in EV)s[k]=0;
 Q.forEach(function(q,i){var p=q.a[ans[i+1]].p;for(var k in p)s[k]+=p[k]});
